/* 🔴 CLD-396 · Marcos, 29/09 06:35: "por que o ponto 1 ainda está estourando? não é
   melhor colocar dois em cima e dois embaixo?"
   Procede, e a causa nao era o numero de cards: era a grade estar FIXA em 3 colunas.
   Medido na V03.02, bloco 1: a 768px cada card ficava com 221px e os TRES titulos
   quebravam em duas linhas; a 1080px, 238px e dois quebravam.
   A saida nao e' cravar "dois em cima e dois embaixo": e' deixar a LARGURA MINIMA mandar.
   Com `auto-fit` e `minmax`, o navegador poe quantos couberem sem espremer — dois em cima
   e um embaixo quando e' o caso, e os quatro do esporte em 2x2 quando a tela aperta. */
.bts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin:14px 0}
@media(max-width:560px){.bts{grid-template-columns:1fr}}

omo se fossem sinônimos. Essa confusão acontece pelo fato de tanto o mar quanto o oceano se referirem a porções vastas de água salgada. No entanto, precisamos compreender que cada um possui um significado diferente.", "Nem toda porção de água é chamada de oceano: existem mares, canais, golfos etc.", "A diferença entre os mares e os oceanos está na sua extensão territorial. Os primeiros são menores, localizados em áreas costeiras e ligados de forma direta ou indireta com os oceanos. Entre os tipos de mares, existem os mares abertos, que possuem uma ligação maior com os oceanos; os mares continentais, que têm uma ligação limitada; e os mares fechados, que estão relacionados com os oceanos apenas de forma indireta, por meio de rios e canais.", "Os oceanos ocupam grandes extensões e são delimitados por porções de terra. Estes são muito profundos, sendo que, até os nossos dias, o ser humano não conseguiu chegar, ou transportar qualquer equipamento ao ponto mais fundo, que pode alcançar milhares de metros.", "Os oceanos existentes em nosso planeta concentram a maior parte da água da Terra, também conhecida como Planeta Azul."], "enunciado": "De acordo com o texto, é correto afirmar que", "alternativas": {"A": "os oceanos se dividem em três tipos: os fechados, os continentais e os abertos.", "B": "os mares são mais profundos que os oceanos, cujas profundezas são conhecidas.", "C": "os termos “oceanos” e “mares” são sinônimos, pois representam territórios com formas e tamanhos similares.", "D": "os mares concentram todas as águas existentes no planeta Terra, daí o nome Planeta Azul.", "E": "os oceanos se diferenciam dos mares, pois aqueles têm maiores extensões que estes."}, "prova": "2023", "pid": "2023-04"}, {"n": 5, "base": "2023::aquaman", "gabarito": "E", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Interpretação · comparação entre textos", "objetivo": "Relacionar a mensagem do texto de apoio à biografia que expressa a mesma ideia.", "enunciado": "Cada alternativa apresenta um resumo biográfico. Assinale aquela em que se identifica a mesma mensagem positiva defendida pelo Aquaman em filmes, conforme descrito no texto.", "alternativas": {"A": "Getúlio Dornelles Vargas, presidente do Brasil. Entre suas realizações, instituiu uma série de direitos aos trabalhadores, como carteira profissional, salário-mínimo, 13º salário e férias remuneradas, motivo pelo qual passou a ser chamado de “o pai dos pobres”.", "B": "Maria Esther Andion Bueno, conhecida como “rainha do tênis”. Maior nome do tênis brasileiro, foi eleita a melhor tenista latino-americana do século XX, sendo considerada um exemplo de como superar dificuldades para obter sucesso.", "C": "César Augusto Cielo Filho, nadador brasileiro. Recordista e vencedor de diversas competições, conquistou a medalha de ouro nos 50 metros livre nos Jogos Olímpicos, prova mais rápida da natação. Está entre os atletas brasileiros com mais medalhas em Campeonatos Mundiais de qualquer esporte.", "D": "Isabel Cristina Leopoldina Augusta Micaela Gabriela Rafaela Gonzaga, a Princesa Isabel. Foi a responsável pela assinatura das leis do Ventre Livre e Áurea que, respectivamente, libertava os filhos de escravizados nascidos no Brasil e abolia a escravidão no país.", "E": "Bruno da Cunha Araújo Pereira, indigenista brasileiro, dedicou-se à proteção dos povos indígenas e da Floresta Amazônica, combatendo ações ilegais de invasores, como garimpeiros e madeireiros, a fim de promover a garantia de direitos a esses povos, como saúde, educação e autonomia."}, "prova": "2023", "pid": "2023-05"}, {"n": 6, "base": "2023::aquaman", "gabarito": "A", "comp": "Matemática", "area": "Matemática", "assunto": "Proporcionalidade direta e unidades", "objetivo": "Converter km/h em m/s e aplicar proporção direta para estimar o gasto calórico.", "enunciado": "Entre os peixes mais velozes do mundo, encontra-se o marlim-negro, que pode atingir a velocidade máxima de 129 km/h.<br><br>Considere que o Aquaman esteja em uma missão. Para passar despercebido pelo sistema de monitoração por sonar de um navio, o herói precisa nadar na mesma velocidade máxima que esse peixe. Admitindo que o consumo de calorias é diretamente proporcional à velocidade, para manter a velocidade mencionada, o Aquaman gasta, em milhões de quilocalorias, por segundo, aproximadamente,", "alternativas": {"A": "2,9.", "B": "5,6.", "C": "10,3.", "D": "20,1.", "E": "37,1."}, "prova": "2023", "pid": "2023-06"}, {"n": 7, "base": "2023::aquaman", "gabarito": "B", "comp": "Ciências", "area": "Ciências da Natureza", "assunto": "Fluidos · densidade e arrasto", "objetivo": "Relacionar a densidade da água à força de arrasto para escolher a profundidade mais econômica.", "enunciado": "O gasto calórico mencionado no texto está relacionado, entre outros fatores, à força de arrasto, que é uma força de resistência que atrapalha o movimento de um corpo em um fluido. A força de arrasto, por sua vez, é diretamente proporcional à densidade do fluido.<br><br>Sabendo que a densidade da água do oceano aumenta com a profundidade, a maneira mais eficiente para que o Aquaman reduza seu gasto calórico, sem diminuir a sua velocidade, é nadar", "alternativas": {"A": "mais próximo ao fundo do oceano.", "B": "mais próximo à superfície do oceano.", "C": "batendo os pés e os braços ao mesmo tempo.", "D": "no ponto médio entre o fundo e a superfície do oceano.", "E": "batendo apenas os pés, mas mantendo os braços junto ao corpo."}, "prova": "2023", "pid": "2023-07"}, {"n": 8, "base": "2023::teia", "gabarito": "C", "comp": "Ciências", "area": "Ciências da Natureza", "assunto": "Ecologia · teia alimentar", "objetivo": "Interpretar a teia alimentar e identificar os níveis tróficos de cada organismo.", "enunciado": "As relações alimentares entre os diversos organismos de um ecossistema costumam ser representadas por meio de diagramas denominados teias alimentares, ou redes alimentares. Essas teias são compostas de diversas cadeias interligadas por meio de setas, que unem os componentes da comunidade entre si, evidenciando suas relações quanto aos diferentes níveis tróficos.<br><br>Considerando a teia alimentar representada, é correto afirmar que", "alternativas": {"A": "as lulas são consumidores terciários, pois se alimentam de leões-marinhos, orcas e pinguins.", "B": "os seres do zooplâncton constituem o primeiro nível trófico e formam a base das cadeias alimentares aquáticas.", "C": "as focas apresentam diferentes hábitos alimentares e ocupam diferentes níveis tróficos.", "D": "os peixes pequenos e o krill pertencem ao mesmo nível trófico, pois se alimentam diretamente do fitoplâncton.", "E": "o extermínio dos pinguins ocasionará a diminuição da população de orcas, pois estas se alimentam daqueles mamíferos."}, "prova": "2023", "pid": "2023-08"}, {"n": 9, "base": "2023::teia", "gabarito": "C", "comp": "Ciências", "area": "Ciências da Natureza", "assunto": "Seres vivos marinhos · características", "objetivo": "Reconhecer características de organismos marinhos representados na teia alimentar.", "enunciado": "Em relação aos seres vivos da teia alimentar marinha apresentada, é correto afirmar que", "alternativas": {"A": "os seres do zooplâncton e os copépodes são macroscópicos, vivem em suspensão na água e produzem seu próprio alimento.", "B": "os seres do fitoplâncton são vegetais que sobrevivem nas regiões escuras dos oceanos sem a incidência de raios solares.", "C": "a baleia-azul é um mamífero sem dentes, que filtra a água do mar de onde retira grandes quantidades de alimento.", "D": "os peixes pequenos e as lulas competem com a baleia azul e com as focas pelo seu alimento.", "E": "os pinguins se alimentam principalmente de copépodes e de peixes pequenos."}, "prova": "2023", "pid": "2023-09"}, {"n": 10, "gabarito": "C", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Leitura de tirinha · empatia", "objetivo": "Interpretar a tirinha e nomear o sentimento que o personagem demonstra.", "imagem": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSc3NjAnIGhlaWdodD0nMjAwJz48cmVjdCB3aWR0aD0nNzYwJyBoZWlnaHQ9JzIwMCcgZmlsbD0nI0ZCRUFFOScgc3Ryb2tlPScjQjMyNjFFJyBzdHJva2Utd2lkdGg9JzYnLz48dGV4dCB4PSczODAnIHk9Jzg4JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmb250LWZhbWlseT0nQXJpYWwnIGZvbnQtc2l6ZT0nMjYnIGZpbGw9JyNCMzI2MUUnPkZpZ3VyYSBkYSBwcm92YSBvZmljaWFsIGFpbmRhIG5hbyBhbmV4YWRhPC90ZXh0Pjx0ZXh0IHg9JzM4MCcgeT0nMTI4JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmb250LWZhbWlseT0nQXJpYWwnIGZvbnQtc2l6ZT0nMjInIGZpbGw9JyM3QTFBMTUnPmZpZ19xMTAucG5nPC90ZXh0Pjwvc3ZnPg==", "imagem_legenda": "tinyurl.com/yw3xh72y · Acesso em: 28.09.2022. Original colorido.", "enunciado": "Leia a tirinha.<br><br>Na narrativa apresentada, o personagem Armandinho demonstra ter uma habilidade importante para a vida em sociedade ao expressar", "alternativas": {"A": "humildade, já que não se importa com os mais necessitados.", "B": "vergonha, porque deve caminhar na rua diante dos colegas.", "C": "empatia, pois se conscientiza sobre e realidade daqueles em condições diferentes da sua.", "D": "acanhamento, porque deve usar tênis velho na rua diante de outras crianças.", "E": "autonomia, pois, diante do constrangimento de ver crianças descalças, ele doa seu tênis."}, "prova": "2023", "pid": "2023-10"}, {"n": 11, "gabarito": "D", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Leitura de charge · crítica social", "objetivo": "Interpretar a crítica social que a charge faz por meio da imagem.", "imagem": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSc3NjAnIGhlaWdodD0nMjAwJz48cmVjdCB3aWR0aD0nNzYwJyBoZWlnaHQ9JzIwMCcgZmlsbD0nI0ZCRUFFOScgc3Ryb2tlPScjQjMyNjFFJyBzdHJva2Utd2lkdGg9JzYnLz48dGV4dCB4PSczODAnIHk9Jzg4JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmb250LWZhbWlseT0nQXJpYWwnIGZvbnQtc2l6ZT0nMjYnIGZpbGw9JyNCMzI2MUUnPkZpZ3VyYSBkYSBwcm92YSBvZmljaWFsIGFpbmRhIG5hbyBhbmV4YWRhPC90ZXh0Pjx0ZXh0IHg9JzM4MCcgeT0nMTI4JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmb250LWZhbWlseT0nQXJpYWwnIGZvbnQtc2l6ZT0nMjInIGZpbGw9JyM3QTFBMTUnPmZpZ19xMTEucG5nPC90ZXh0Pjwvc3ZnPg==", "imagem_legenda": "tinyurl.com/3xefxbt9 · Acesso em: 17.09.2022. Original colorido.", "enunciado": "Leia a charge.<br><br>Examinando a charge, é correto afirmar que ela representa", "alternativas": {"A": "a hostilidade do ambiente marinho ao ser humano, mas que abriga em segurança a vida de peixes e plantas.", "B": "o cenário apocalíptico de um vazamento nuclear e as consequências de uma sociedade sem ONGs de proteção ambiental.", "C": "o resultado de uma sociedade ambientalmente sustentável, que propõe soluções viáveis para a convivência entre os seres vivos.", "D": "a poluição de mares e rios, que coloca em risco a manutenção da vida nesses ambientes e gera a necessidade de intervenções protetivas.", "E": "a urgência com que o curso dos rios deve ser alterado para garantir a sobrevivência de peixes e humanos atingidos pela poluição do ar e das águas."}, "prova": "2023", "pid": "2023-11"}, {"n": 12, "gabarito": "D", "comp": "Geografia", "area": "Ciências Humanas", "assunto": "Dinâmica da Terra · tsunâmis", "objetivo": "Identificar as causas geológicas que dão origem a um tsunâmi.", "texto_proprio": ["Grande onda ou sucessão de ondas marinhas que se deslocam através do oceano por milhares de quilômetros em alta velocidade (podem viajar a mais de 700 km/h). Caracteriza-se por ter grande extensão, chegando a ter mais de 100 km de comprimento, nas linhas da costa pode elevar-se a grande altura, (de 30 metros a 40 metros), e invadir violentamente as praias.", "Tsunâmi é um dos desastres naturais que podem, com frequência, atingir dimensões catastróficas ao provocar a morte de milhares de pessoas. Um tsunâmi pode ter várias origens."], "enunciado": "Leia a definição de tsunâmi, extraída do site da Comissão Brasileira de Sítios Geológicos (SIGEP).<br><br>Dentre as origens desse fenômeno, é correto citar", "alternativas": {"A": "o aquecimento anormal das águas do oceano Atlântico.", "B": "os movimentos de rotação e de translação do planeta Terra.", "C": "as ações de correntes marítimas frias de origem equatorial.", "D": "os tremores sísmicos no assoalho oceânico e/ou vulcanismo.", "E": "os deslocamentos dos oceanos existentes no núcleo interno do nosso planeta."}, "prova": "2023", "pid": "2023-12"}, {"n": 1, "gabarito": "C", "comp": "Ciências", "area": "Ciências da Natureza", "assunto": "Botânica · cultivo e raízes", "objetivo": "Reconhecer o cuidado correto com a rega e a respiração das raízes das plantas.", "texto_proprio": ["As plantas proporcionam uma infinidade de benefícios que são essenciais para a manutenção da vida na Terra, como a produção de alimentos e de oxigênio. Além disso, são fontes de matéria-prima para a indústria, uma vez que são utilizadas para a produção de biocombustíveis e de remédios.", "Outro papel fundamental das plantas é o controle da dinâmica da água na Terra e da temperatura do planeta.", "Compreender suas funções vitais é importante para promover esforços de conservação do meio ambiente."], "enunciado": "Em relação ao cultivo de plantas, uma ação que devemos adotar é", "alternativas": {"A": "evitar adubar a terra, a fim de impedir o excesso de nutrientes tóxicos e a proliferação tanto de pragas quanto de plantas daninhas.", "B": "permitir que lesmas e caramujos cresçam entre as plantas, a fim de estimular a polinização das flores e a formação dos frutos.", "C": "utilizar a quantidade certa de água para cada tipo de planta, a fim de impedir que o solo fique encharcado e as raízes não consigam respirar.", "D": "evitar o uso de qualquer tipo de controle biológico, a fim de impedir a proliferação de pragas e insetos transmissores de doenças.", "E": "optar por locais bem ventilados, a fim de impedir a evaporação da água do solo, o que facilita a condução de seiva pelos vasos das plantas."}, "prova": "2024-2025", "pid": "2024-2025-01"}, {"n": 2, "gabarito": "D", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Interpretação de texto · compreensão literal", "objetivo": "Localizar no texto os efeitos da monocultura e descartar afirmações falsas.", "texto_proprio": ["Segundo a Organização das Nações Unidas para Alimentação e Agricultura (FAO), na história da humanidade, das 30 mil espécies de plantas comestíveis, somente de 6 a 7 mil espécies foram cultivadas para produzir alimentos.", "Atualmente, usamos apenas 170 culturas em uma escala comercial significativa, no entanto, dependemos somente de 30 delas para nos fornecer as calorias e os nutrientes de que precisamos todos os dias.", "Geralmente, 60% das calorias vegetais da dieta humana são provenientes de três grãos – arroz, milho e trigo – que não fornecem as doses necessárias de vitaminas e minerais.", "Além disso, a monocultura desses grãos pode provocar a degradação do solo, acarretando o esgotamento de seus nutrientes e, consequentemente, o empobrecimento nutricional.", "Por outro lado, existem milhares de culturas que foram esquecidas ou subutilizadas e que nunca entraram no mercado mundial. Isso ocorre talvez pelo fato de terem sido cultivadas em pequenas áreas geográficas, ou terem baixo rendimento, ou ainda porque não foram devidamente pesquisadas."], "enunciado": "Baseando-se no texto, é correto afirmar que", "alternativas": {"A": "a totalidade das espécies de plantas comestíveis conhecidas foi cultivada, desenvolvida e usada comercialmente, ao longo do tempo, para a produção de alimento.", "B": "dependemos, atualmente, de todas as culturas usadas em escala comercial para conseguirmos obter as calorias e os nutrientes de que precisamos todos os dias.", "C": "as culturas atuais de arroz, trigo e milho fornecem às pessoas todas as calorias vegetais necessárias à sobrevivência e oferecem todos os tipos de minerais e vitaminas essenciais à dieta humana.", "D": "o cultivo de uma mesma espécie em uma determinada área está associado a diversos impactos ambientais, como o empobrecimento do solo e o desenvolvimento de doenças ou pragas.", "E": "as culturas esquecidas ou subutilizadas, apesar de terem sido muito pesquisadas e apresentarem elevado rendimento de produção, não foram produzidas e comercializadas em escala global."}, "prova": "2024-2025", "pid": "2024-2025-02"}, {"n": 3, "gabarito": "D", "comp": "Geografia", "area": "Ciências Humanas", "assunto": "Geografia agrária · produção de trigo", "objetivo": "Identificar em que países o trigo é cultivado em larga escala.", "texto_proprio": ["Há dez mil anos, o trigo era apenas uma gramínea silvestre, confinada a uma pequena região do Oriente Médio. Em apenas alguns milênios, estava crescendo no mundo inteiro. Em áreas como as Grandes Planícies da América do Norte, onde não crescia um único pé de trigo há 10 mil anos, hoje podemos caminhar por centenas de quilômetros sem encontrar nenhuma outra planta. Atualmente, o trigo cobre 2,25 milhões de quilômetros quadrados da superfície do globo, quase 10 vezes o tamanho da Grã-Bretanha.", "O trigo não gostava de rochas e pedregulhos, nem de dividir espaço, água e nutrientes com outras plantas, por isso os seres humanos tiveram que dedicar cada vez mais esforços para seu cultivo.", "<span class='fonte'>HARARI, Yuval Noah. Sapiens – Uma breve história da humanidade. 8 ed. Porto Alegre. L&amp;PM, 2015. p. 90. Adaptado.</span>"], "enunciado": "Sobre o cereal mencionado no texto, é correto afirmar que é", "alternativas": {"A": "o principal produto agrícola plantado na região Centro-Oeste do Brasil.", "B": "na Grã-Bretanha onde se encontra a maior área plantada do planeta.", "C": "o principal produto de exportação dos países do Oriente Médio.", "D": "plantado em larga escala nos Estados Unidos e no Canadá.", "E": "cultivado nos desertos rochosos da Europa e da África."}, "prova": "2024-2025", "pid": "2024-2025-03"}, {"n": 4, "gabarito": "B", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Interpretação de texto · compreensão literal", "objetivo": "Reconhecer, no texto, o potencial das PANCs no combate à fome.", "texto_proprio": ["A sigla PANCs significa Plantas Alimentícias Não Convencionais, ou seja, espécies já conhecidas, mas que não são popularmente consumidas. Acredita-se que o Brasil tenha, aproximadamente, 10 mil espécies de plantas com potencial de uso alimentar.", "Elas são uma excelente alternativa de alimentação sustentável, já que atendem à demanda por nutrientes que suprem as necessidades humanas. No entanto, os estudos e os cultivos dessas espécies ainda não são amplamente desenvolvidas.", "Infelizmente, essas plantas ainda não são produzidas em larga escala. Isso poderia ajudar a combater a fome, por exemplo.", "O que se sabe é que essas espécies são rústicas, propagadas por mudas ou sementes e resistentes a doenças e pragas.", "Além disso, as PANCs, geralmente hortaliças, têm como característica a boa adaptação climática e a grande eficiência na absorção de nutrientes."], "enunciado": "De acordo com o texto, é correto afirmar que", "alternativas": {"A": "as PANCs não permitem uma alimentação adequada ao ser humano.", "B": "a utilização das PANCs tem potencial para minimizar o problema da fome.", "C": "a pouca resistência às pragas é um empecilho ao cultivo das PANCs.", "D": "as PANCs não suportam as condições climáticas brasileiras.", "E": "a grande produção de PANCs torna o Brasil exportador desse alimento."}, "prova": "2024-2025", "pid": "2024-2025-04"}, {"n": 5, "gabarito": "D", "comp": "Matemática", "area": "Matemática", "assunto": "Porcentagem e regra de três", "objetivo": "Calcular a perda percentual na torrefação e o número de sacas necessárias.", "texto_proprio": ["Sócrates não tomou um pingado com Platão. Cleópatra e Júlio César jamais marcaram um <i>date</i> num café de Alexandria. A humanidade só conheceu o café bem depois. Hoje, ele é um dos mais valiosos produtos primários comercializados no mundo, tanto que, em 2022, foi produzido um total de 171,7 milhões de sacas desse grão.", "É curioso observar que cada saca de café verde tem 60 kg e rende somente 48 kg de café torrado, ou seja, o café perde cerca de <b>I</b>% de sua massa durante o processo de torrefação. Deste modo, é possível estimar que, para produzir uma tonelada de café torrado, são necessárias, no mínimo, <b>II</b> sacas de café verde."], "enunciado": "Leia o texto e assinale a alternativa que completa correta e respectivamente os espaços numerados I e II.", "alternativas": {"A": "I = 12 · II = 21", "B": "I = 12 · II = 35", "C": "I = 20 · II = 35", "D": "I = 20 · II = 21", "E": "I = 21 · II = 35"}, "prova": "2024-2025", "pid": "2024-2025-05"}, {"n": 6, "gabarito": "D", "comp": "Ciências", "area": "Ciências da Natureza", "assunto": "Eletricidade · Lei de Ohm", "objetivo": "Aplicar a Lei de Ohm com potências de dez para calcular a resistência elétrica.", "texto_proprio": ["Plantas carnívoras, como as dioneias, são conhecidas pelo aprisionamento de suas presas. Esse movimento ocorre por um processo denominado tigmonastia, em que, ao serem tocadas, as células sensíveis da planta geram sinais elétricos que são propagados rapidamente e fazem com que a planta se feche.", "Durante o fechamento das folhas, a resistência elétrica entre dois pontos do caule pode ser obtida por meio da Lei de Ohm, conhecida por U = R · i, em que a diferença de potencial (U) aplicada nesses pontos gera uma corrente elétrica (i) que depende da resistência elétrica (R) do material."], "enunciado": "Se uma diferença de potencial de 1 × 10<sup>–1</sup> volt é aplicada entre esses pontos e a corrente elétrica medida é de 2 × 10<sup>–8</sup> ampères, a resistência elétrica, medida em ohm, do caule da planta é", "alternativas": {"A": "5 × 10<sup>–9</sup>.", "B": "5 × 10<sup>–7</sup>.", "C": "5 × 10<sup>–1</sup>.", "D": "5 × 10<sup>6</sup>.", "E": "5 × 10<sup>8</sup>."}, "prova": "2024-2025", "pid": "2024-2025-06"}, {"n": 7, "base": "2024-2025::cientirinhas", "gabarito": "E", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Quadrinhos · construção do humor", "objetivo": "Explicar de que modo os quadrinhos constroem o efeito de humor.", "enunciado": "A construção de humor no texto se deve, entre outros fatores,", "alternativas": {"A": "à valorização do masculino, ao representá-lo como uma flor, o Cravo.", "B": "à linguagem cerimoniosa e solene empregada pela Planta Carnívora.", "C": "ao uso da linguagem verbal para amenizar atos de violência doméstica.", "D": "à atribuição de comportamentos animalizados, como o canibalismo, a seres humanos.", "E": "à prática da fofoca como um traço essencial para a sobrevivência da Planta Carnívora."}, "prova": "2024-2025", "pid": "2024-2025-07"}, {"n": 8, "base": "2024-2025::cientirinhas", "gabarito": "C", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Análise linguística · vocativo e coloquialidade", "objetivo": "Analisar a função de termos e marcas de coloquialidade usados nos quadrinhos.", "enunciado": "Após a leitura atenta dos quadrinhos, é correto afirmar que", "alternativas": {"A": "as referências a “Rosa”, “Cravo” e “debaixo da sacada” constroem uma relação metalinguística imprescindível para a compreensão do humor nos quadrinhos.", "B": "o termo “ojeriza”, no contexto apresentado, assume uma conotação positiva, em oposição ao seu sentido original de “aversão”, “antipatia”.", "C": "os termos “amiga” e “menina” cumprem a mesma função de interlocução com o receptor, conhecida como vocativo.", "D": "o termo “pra”, presente no primeiro e no terceiro quadrinhos, expressa localização em ambas as ocorrências.", "E": "os traços de coloquialidade, como “pra”, “né” e “falo na lata”, são inadequados ao gênero desenvolvido."}, "prova": "2024-2025", "pid": "2024-2025-08"}, {"n": 9, "base": "2024-2025::cientirinhas", "gabarito": "A", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Interjeição · efeito de sentido", "objetivo": "Reconhecer o sentimento que a interjeição expressa no contexto do quadrinho.", "enunciado": "No quarto quadrinho, a interjeição “uai” evidencia que a personagem, diante da pergunta de sua amiga, experiencia", "alternativas": {"A": "surpresa.", "B": "alegria.", "C": "medo.", "D": "apatia.", "E": "aversão."}, "prova": "2024-2025", "pid": "2024-2025-09"}, {"n": 10, "base": "2024-2025::cravos", "gabarito": "E", "comp": "História", "area": "Ciências Humanas", "assunto": "Revolução dos Cravos · Portugal", "objetivo": "Identificar o evento histórico que pôs fim à ditadura salazarista em Portugal.", "enunciado": "O evento histórico descrito no texto foi batizado de", "alternativas": {"A": "Guerra da Papoula, e ocorreu na China.", "B": "Guerra das Duas Rosas, e ocorreu na Inglaterra.", "C": "Revolução do Mandacaru, e ocorreu no Brasil.", "D": "Revolução do Lótus, e ocorreu na Índia.", "E": "Revolução dos Cravos, e ocorreu em Portugal."}, "prova": "2024-2025", "pid": "2024-2025-10"}, {"n": 11, "base": "2024-2025::cravos", "gabarito": "A", "comp": "História", "area": "Ciências Humanas", "assunto": "Colônias portuguesas na África", "objetivo": "Reconhecer quais países africanos eram colônias de Portugal no século XX.", "enunciado": "Dentre as colônias a que o texto se refere, podemos citar corretamente", "alternativas": {"A": "Angola e Cabo Verde.", "B": "Nigéria e África do Sul.", "C": "Madagascar e Senegal.", "D": "Etiópia e Saara Ocidental.", "E": "República Centro-Africana e Mali."}, "prova": "2024-2025", "pid": "2024-2025-11"}, {"n": 12, "base": "2024-2025::cravo", "gabarito": "B", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Interpretação de texto · compreensão literal", "objetivo": "Localizar no texto informações corretas sobre os usos do cravo-da-índia.", "enunciado": "Sobre o texto, é correto afirmar que", "alternativas": {"A": "se extraía ouro, junto ao eugenol, na Antiguidade.", "B": "o cravo-da-índia pode ser usado em açucareiros por repelir formigas.", "C": "o eugenol, devido a sua ação repelente, é usado na fabricação de medicamentos.", "D": "a vanilina está presente no óleo essencial do cravo-da-índia.", "E": "o eugenol exala o aroma artificial de baunilha."}, "prova": "2024-2025", "pid": "2024-2025-12"}, {"n": 1, "gabarito": "D", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Interpretação de texto · compreensão literal", "objetivo": "Reconhecer, no texto, os efeitos da domesticação de animais sobre a vida humana.", "texto_proprio": ["A convivência com os animais mudou os seres humanos. Talvez o exemplo mais popular seja o consumo de leite: antes da domesticação animal, as pessoas naturalmente desenvolviam intolerância a lactose à medida que cresciam e não precisavam mais do leite materno. Quando os seres humanos começaram a criar gado, começaram a beber mais leite, havendo uma adaptação do sistema digestivo para o consumo do leite durante toda a vida.", "A domesticação é parte da conexão humana com os animais, que percorre toda a história e conecta grandes saltos evolutivos, como o desenvolvimento de ferramentas e até da linguagem."], "enunciado": "Segundo o texto, a domesticação de animais", "alternativas": {"A": "ocorreu recentemente, no período medieval, e foi possível devido à invenção da linguagem e das ferramentas de pedra.", "B": "causou danos à saúde humana, que não estava preparada para o consumo de leite na vida adulta, diminuindo a expectativa média de vida do homem contemporâneo.", "C": "aumentou os níveis naturais de intolerância a lactose no homem pré-histórico devido às diferenças entre o leite materno e o leite de vaca.", "D": "contribuiu para o desenvolvimento de aspectos culturais que favoreceram a evolução humana, como a criação de ferramentas e da linguagem.", "E": "provocou saltos evolutivos que atrasaram o desenvolvimento da linguagem e da tecnologia."}, "prova": "2025-2026", "pid": "2025-2026-01"}, {"n": 2, "base": "2025-2026::caes", "gabarito": "C", "comp": "Matemática", "area": "Matemática", "assunto": "Razão e aproximação numérica", "objetivo": "Calcular a razão entre duas quantidades e escolher a melhor aproximação.", "enunciado": "De acordo com o texto e considerando que existem atualmente, no Brasil, cerca de 6,5 milhões de pessoas com deficiência visual, assinale a alternativa que apresenta a melhor aproximação da razão entre o número de cães-guia em atividade e o número de pessoas com deficiência visual em nosso país, respectivamente.", "alternativas": {"A": "1 para cada 29 000", "B": "1 para cada 30 500", "C": "1 para cada 31 400", "D": "1 para cada 31 800", "E": "1 para cada 32 700"}, "prova": "2025-2026", "pid": "2025-2026-02"}, {"n": 3, "base": "2025-2026::caes", "gabarito": "D", "comp": "Matemática", "area": "Matemática", "assunto": "Porcentagem e gráfico de setores", "objetivo": "Converter dados em porcentagens e escolher o gráfico de setores correspondente.", "imagem": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSc3NjAnIGhlaWdodD0nMjAwJz48cmVjdCB3aWR0aD0nNzYwJyBoZWlnaHQ9JzIwMCcgZmlsbD0nI0ZCRUFFOScgc3Ryb2tlPScjQjMyNjFFJyBzdHJva2Utd2lkdGg9JzYnLz48dGV4dCB4PSczODAnIHk9Jzg4JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmb250LWZhbWlseT0nQXJpYWwnIGZvbnQtc2l6ZT0nMjYnIGZpbGw9JyNCMzI2MUUnPkZpZ3VyYSBkYSBwcm92YSBvZmljaWFsIGFpbmRhIG5hbyBhbmV4YWRhPC90ZXh0Pjx0ZXh0IHg9JzM4MCcgeT0nMTI4JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmb250LWZhbWlseT0nQXJpYWwnIGZvbnQtc2l6ZT0nMjInIGZpbGw9JyM3QTFBMTUnPmZpZzI2X3EwMy5wbmc8L3RleHQ+PC9zdmc+", "imagem_legenda": "Gráficos do caderno oficial · 1º SEM/2026, página 3.", "enunciado": "Com base nos dados sobre as raças, assinale a alternativa que apresenta o gráfico de setor que melhor representa a distribuição de cães-guia.", "alternativas": {"A": "primeiro gráfico: Labradores 77%, Golden Retriever 8%, outras raças 16%.", "B": "segundo gráfico: Labradores 77%, Golden Retriever 16%, outras raças 8%.", "C": "terceiro gráfico: Labradores 33%, Golden Retriever 33%, outras raças 33%.", "D": "quarto gráfico: Labradores 74%, Golden Retriever 8%, outras raças 18%.", "E": "quinto gráfico: Labradores 74%, Golden Retriever 18%, outras raças 8%."}, "prova": "2025-2026", "pid": "2025-2026-03"}, {"n": 4, "gabarito": "E", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Interpretação de texto literário", "objetivo": "Interpretar o sentido figurado do trecho literário sobre o modo de viver do cão.", "texto_proprio": ["Meu cão me revigora toda. Sem falar que dorme às vezes aos meus pés enchendo o quarto da cálida vida úmida. O meu cão me ensina a viver. Ele só fica “sendo”. “Ser” é a sua atividade.", "<span class='fonte'>LISPECTOR, Clarice. Um sopro de vida. Org. Olga Borelli. Rio de Janeiro: Rocco, 1999, p. 43.</span>"], "enunciado": "Na passagem apresentada, o cão é usado como modelo a ser seguido por", "alternativas": {"A": "realizar com simplicidade ações complexas, como acalentar as dores alheias e submeter-se constantemente às vontades dos outros.", "B": "sentir-se acolhido ao ser inferiorizado diante de seus superiores hierárquicos, evidenciando a aceitação de sua posição social.", "C": "manter uma atitude de inquietação constante diante da existência, levando-o a revigorar a sociedade em que se encontra.", "D": "regozijar-se diante da possibilidade de tornar um outro indivíduo tenso pela simples companhia que pode oferecer.", "E": "viver com plenitude sua existência, sem se deixar levar por infrutíferas angústias durante esse processo."}, "prova": "2025-2026", "pid": "2025-2026-04"}, {"n": 5, "gabarito": "A", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Interpretação de texto · inferência", "objetivo": "Concluir, a partir do texto, como os egípcios associavam os felinos aos seus deuses.", "texto_proprio": ["Uma das primeiras domesticações de gatos aconteceu no antigo Egito. Os gatos, felinos menores, viviam entre os humanos, sendo essenciais para a sociedade egípcia na proteção contra pragas de casas e de celeiros.", "Já os felinos maiores, principalmente leões e leopardos, eram admirados por suas qualidades, sendo, muitas vezes, símbolos da realeza e de alguns deuses do panteão egípcio.", "Por meio da observação, os egípcios vieram a admirar os felinos pela sua natureza complexa e dual. Para eles, esses animais combinavam graça, fertilidade e cuidado suave com agressão, rapidez e perigo. Os deuses relacionados a essas qualidades eram frequentemente representados com características felinas."], "enunciado": "A partir da leitura do texto, é correto concluir que", "alternativas": {"A": "os egípcios observavam nos felinos algumas características que consideravam admiráveis, como graça, fertilidade, cuidado e rapidez, e as projetavam em seus deuses.", "B": "os felinos eram importantes para a sociedade egípcia apenas por suas funções práticas, como o controle de pragas em casas e em celeiros.", "C": "a admiração dos egípcios se restringia aos felinos menores, que viviam entre os humanos e eram considerados símbolos de realeza.", "D": "a observação atenta levou os egípcios a considerar os felinos uma espécie contraditória cujas características de personalidade deveriam ser evitadas.", "E": "as divindades egípcias representavam ideais nobres e estavam relacionadas à crença de que os seres humanos são superiores aos animais."}, "prova": "2025-2026", "pid": "2025-2026-05"}, {"n": 6, "gabarito": "E", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Interpretação de texto · compreensão literal", "objetivo": "Localizar no texto os benefícios da convivência entre crianças e animais.", "texto_proprio": ["A convivência com <i>pets</i> pode ajudar no desenvolvimento afetivo e psicológico, aumentando a produção de endorfina no organismo, minimizando os efeitos da depressão, da dor e da ansiedade.", "Pesquisas revelam que 80% das pessoas se sentem menos solitárias ao conviver com um animal de estimação e que o ato de fazer carinho em um animal é capaz de diminuir a frequência cardíaca e a pressão sanguínea de uma pessoa. Entre os efeitos positivos de intervenções assistidas realizadas com animais e destinadas a crianças, estão melhora na convivência social, na capacidade de concentração e nas habilidades de comunicação."], "enunciado": "De acordo com o texto, a convivência entre crianças e animais acarreta", "alternativas": {"A": "aumento da produção de endorfina no organismo, tornando dispensável qualquer tipo de acompanhamento emocional.", "B": "dependência emocional tão intensa que a criança rejeita completamente o convívio social, isolando-se do mundo.", "C": "redução da necessidade de tomar medicamentos, de fazer exercícios físicos e de se preocupar com alimentação saudável.", "D": "desfavorecimento do desenvolvimento da capacidade de organização, uma vez que ajuda a criança a criar uma rotina.", "E": "melhora habilidades de convivência social e de comunicação, contribuindo para o desenvolvimento afetivo e psicológico."}, "prova": "2025-2026", "pid": "2025-2026-06"}, {"n": 7, "gabarito": "E", "comp": "História", "area": "Ciências Humanas", "assunto": "Guerra Fria · corrida espacial", "objetivo": "Identificar o período histórico da disputa espacial entre União Soviética e Estados Unidos.", "texto_proprio": ["A cachorrinha Laika, lançada no satélite russo Sputnik 2, em 1957, não retornou. Entre 1948 e 1961, União Soviética (URSS) e Estados Unidos (EUA) enviaram 65 animais ao espaço, sendo 48 cães, 15 macacos e 2 coelhos. Vinte e sete deles morreram em acidentes devido a circunstâncias imprevistas durante a empreitada.", "O envio de animais não humanos ao espaço começou a cessar com o lançamento de pessoas. Yuri Gagarin, que ficou uma hora e meia no espaço em 1961, brincou uma vez dizendo que foi, ao mesmo tempo, a “primeira pessoa e o último cachorro no espaço”."], "enunciado": "O processo histórico referido no texto é característico do período conhecido como", "alternativas": {"A": "Primeira Revolução Industrial.", "B": "Segunda Guerra Mundial.", "C": "Reconstrução Europeia.", "D": "Grandes Navegações.", "E": "Guerra Fria."}, "prova": "2025-2026", "pid": "2025-2026-07"}, {"n": 8, "base": "2025-2026::xerimbabos", "gabarito": "D", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Interpretação de texto · compreensão literal", "objetivo": "Reconhecer, no texto, como a comunidade indígena se relaciona com os animais.", "enunciado": "Segundo o texto, é correto afirmar que", "alternativas": {"A": "o vocábulo “xerimbabos”, cujo sentido equivale a “entes muito amados”, é usado para se referir às crianças que desenvolvem afeto pelos animais silvestres.", "B": "o movimento repentino de ataque do bicho-preguiça traumatizou as irmãs Yzuahy e Ywàna, desacostumadas ao convívio com a natureza local.", "C": "a relação afetiva desenvolvida entre os animais silvestres e os domésticos acarretou desequilíbrio ecológico para a comunidade indígena.", "D": "a relação com a fauna e a flora é essencial para uma vivência harmônica na sociedade em que as irmãs residem.", "E": "o cuidado com a fauna local realizado pelos indígenas introduziu o conceito de “animais domésticos” à comunidade."}, "prova": "2025-2026", "pid": "2025-2026-08"}, {"n": 9, "base": "2025-2026::xerimbabos", "gabarito": "D", "comp": "Ciências", "area": "Ciências da Natureza", "assunto": "Zoologia e cadeia alimentar", "objetivo": "Reconhecer características dos animais citados e a posição da onça na cadeia alimentar.", "enunciado": "Além dos animais citados no texto, muitos grupos indígenas ainda consideram águias, corujas, sabiás, raposas, cobras e tartarugas como animais sagrados, sendo a onça um símbolo cultural e espiritual, vista como a guardiã da floresta.<br><br>Sobre os animais citados, é correto afirmar que", "alternativas": {"A": "as aves se caracterizam por serem animais carnívoros, dotados de bico forte e curvo, com garras afiadas, com pelos e escamas no corpo e nas patas.", "B": "a relação dos indígenas com os xerimbabos tem o objetivo de garantir a criação desses animais em cativeiro para o abate diário e a alimentação da comunidade.", "C": "os xerimbabos são muito queridos pelos indígenas e, apesar de estarem em cativeiro, são cuidados com muito respeito e soltos na floresta quando em perigo de extinção.", "D": "a onça é considerada a guardiã da floresta, ocupa o topo da cadeia alimentar por se alimentar de herbívoros maiores e de predadores menores, mantendo dessa forma o equilíbrio ambiental.", "E": "os animais considerados sagrados pelos indígenas se caracterizam por serem carnívoros e por conseguirem manter a temperatura corporal constante, independentemente da temperatura do ambiente."}, "prova": "2025-2026", "pid": "2025-2026-09"}, {"n": 10, "base": "2025-2026::xerimbabos", "gabarito": "E", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Adjuntos adverbiais · circunstâncias", "objetivo": "Identificar a circunstância que cada expressão destacada expressa no texto.", "enunciado": "As expressões em negrito no texto denotam, respectivamente,", "alternativas": {"A": "tempo, origem, causa e lugar.", "B": "condição, destino, instrumento e causa.", "C": "consequência, origem, companhia e tempo.", "D": "condição, destino, ferramenta e causa.", "E": "tempo, lugar, companhia e lugar."}, "prova": "2025-2026", "pid": "2025-2026-10"}, {"n": 11, "base": "2025-2026::xerimbabos", "gabarito": "C", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Locução verbal · aspecto da ação", "objetivo": "Reconhecer o aspecto de conclusão que a locução verbal atribui à ação.", "enunciado": "Na passagem “quando cresceu, ficou livre e acabou indo com o seu bando”, a expressão “acabou indo” aponta", "alternativas": {"A": "uma ação inacabada que é realizada recorrentemente.", "B": "uma ação inacabada que se prolonga infinitamente.", "C": "uma ação finalizada que é enfatizada ao terminar.", "D": "o início de uma ação que se realiza rapidamente.", "E": "o desenvolvimento de uma ação que não se concretiza."}, "prova": "2025-2026", "pid": "2025-2026-11"}, {"n": 12, "base": "2025-2026::xerimbabos", "gabarito": "D", "comp": "Língua Portuguesa", "area": "Linguagens", "assunto": "Coesão · referência pronominal", "objetivo": "Identificar a que termos do parágrafo o pronome sublinhado se refere.", "enunciado": "O pronome <u>eles</u>, sublinhado no quarto parágrafo do texto, refere-se aos termos", "alternativas": {"A": "“territórios” e “<i>pets</i>”.", "B": "“<i>pets</i>” e “adultos”.", "C": "“indígenas” e “animais”.", "D": "“<i>pets</i>” e “animais”.", "E": "“territórios” e “adultos”."}, "prova": "2025-2026", "pid": "2025-2026-12"}];
var BASES   = {"2023::oceanos": {"titulo": "Leia o texto para responder às questões de 01 a 03.", "paragrafos": ["<u>Você</u> sabia que o oceano desempenha um papel fundamental na regulação do clima no planeta? Vivemos em um planeta azul, com oceanos e mares cobrindo mais de 70% da superfície da Terra.", "Os oceanos <u>nos</u> alimentam, regulam nosso clima e geram a maior parte do oxigênio <u>que</u> respiramos.", "Apesar de <u>sua</u> importância, os oceanos estão enfrentando ameaças sem precedentes como resultado da atividade humana. Todos os anos, cerca de 8 milhões de toneladas de resíduo plástico acabam nos ecossistemas marinhos.", "Ao mesmo tempo, a crise climática está danificando os recifes de coral e outros ecossistemas importantes, a pesca excessiva ameaça a estabilidade dos estoques de peixes, a poluição por nutrientes contribui para a criação de zonas mortas, e quase 80% das águas residuais do mundo são descartadas sem tratamento nos oceanos.", "Cuidar dos oceanos é cuidar do clima e da vida. Como as mudanças climáticas afetam você? Conte pra gente! #HoraDeAgir #mudançadoclima #criseclimática #AçãoClimática"], "fonte": "tinyurl.com/bdh8vhjk · Acesso em: 14.09.2022. Adaptado."}, "2023::aquaman": {"titulo": "Leia o texto para responder às questões de 05 a 07.", "paragrafos": ["Estamos longe de compreender a complexidade dos oceanos. Nesse sentido, Aquaman, herdeiro do trono de Atlantis, está entre os super-heróis que mais têm conhecimento sobre essa parte do nosso planeta. Além disso, o personagem já apareceu em filmes promovendo a coexistência entre diferentes povos, bem como a preservação do meio ambiente.", "Nas suas histórias, existem relatos de que o herói é capaz de atingir a velocidade de 3 mil metros por segundo quando está nadando, o que exigiria um gasto de 240 milhões de quilocalorias a cada segundo."], "fonte": ""}, "2023::teia": {"titulo": "Analise o diagrama para responder às questões 08 e 09.", "paragrafos": [], "imagem": "data:image/svg+xm ado popularmente em açucareiros. Além disso, ele é usado na fabricação de medicamentos por suas propriedades antimicrobianas, antifúngicas, antivirais e anti-inflamatórias.", "Seu óleo essencial é rico em eugenol, princípio ativo responsável pelas propriedades analgésicas e antissépticas, sendo bastante usado em odontologia. Fonte de matéria-prima para a fabricação de fragrâncias e aromatizantes, também foi usado anteriormente para sintetizar a vanilina (aroma artificial de baunilha)."], "imagem": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSc3NjAnIGhlaWdodD0nMjAwJz48cmVjdCB3aWR0aD0nNzYwJyBoZWlnaHQ9JzIwMCcgZmlsbD0nI0ZCRUFFOScgc3Ryb2tlPScjQjMyNjFFJyBzdHJva2Utd2lkdGg9JzYnLz48dGV4dCB4PSczODAnIHk9Jzg4JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmb250LWZhbWlseT0nQXJpYWwnIGZvbnQtc2l6ZT0nMjYnIGZpbGw9JyNCMzI2MUUnPkZpZ3VyYSBkYSBwcm92YSBvZmljaWFsIGFpbmRhIG5hbyBhbmV4YWRhPC90ZXh0Pjx0ZXh0IHg9JzM4MCcgeT0nMTI4JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmb250LWZhbWlseT0nQXJpYWwnIGZvbnQtc2l6ZT0nMjInIGZpbGw9JyM3QTFBMTUnPmZpZzI1X3ExMi5wbmc8L3RleHQ+PC9zdmc+", "fonte": "tinyurl.com/nmm3dzrv · Acesso em: 09.09.2024. Adaptado."}, "2024-2025::cravos": {"titulo": "Leia o texto para responder às questões 10 e 11.", "paragrafos": ["O movimento, que completou 50 anos em 2024, foi o responsável pelo fim da longeva ditadura de António de Oliveira Salazar, substituído, em 1968, por Marcello Caetano. Esse movimento ficou conhecido pelo nome da flor que a população colocava nos canos das armas dos soldados do exército, que se rebelaram para dar um basta ao estado de coisas que sufocava a vida do país, restabelecendo a democracia.", "Um dos motivos da insatisfação foi a desastrosa campanha militar do governo ditatorial para enfrentar os movimentos de libertação nacional que estavam ocorrendo em suas colônias na África."], "fonte": ""}, "2025-2026::caes": {"titulo": "Leia o texto para responder às questões 02 e 03.", "paragrafos": ["Cães-guia são treinados para facilitar a locomoção e conduzir a pessoa cega ou com baixa visão em segurança. Estima-se que, atualmente, 207 cães-guia estão em atividade no Brasil. Em uma perspectiva de distribuição quanto às raças, predominam Labradores (153) e Golden Retriever (16)."], "fonte": "tinyurl.com/4ts3d877 · Acesso em: 05.04.2025. Adaptado."}, "2025-2026::xerimbabos": {"titulo": "Leia o texto para responder às questões de 08 a 12.", "paragrafos": ["<b>Certa manhã</b>, as irmãs Yzuahy, de 6 anos, e Ywàna, de 3, tomaram um susto: um bicho-preguiça estava dentro de casa. O visitante inesperado entrou de mansinho pela janela e logo chegou ao colo das irmãs Tenetehar sem provocar medo. Pelo contrário, o que havia era encanto.", "Moradoras da terra indígena do Alto Rio Guamá, <b>no Pará</b>, Yzuahy e Ywàna aprenderam com os pais e os avós que bichos da floresta não fazem mal nem precisam ser afugentados. A relação com eles é ancestral e baseada no cuidado mútuo. “Elas sempre foram ensinadas que, sem natureza e animais, nada progride”, conta Josiane Tenetehar, mãe das meninas.", "Além do bicho-preguiça, elas cuidaram por um tempo de um filhote de capivara. “Não temos animais de estimação. A preguiça vem às vezes, chega em casa e depois volta. A capivara ficava <b>com as meninas</b> porque os guerreiros da aldeia acharam ela na mata sem a mãe e trouxeram para ser cuidada. Quando cresceu, ficou livre e acabou indo com o seu bando”, explica Josiane.", "Nos territórios indígenas, não há <i>pets</i> do jeito como vemos nas cidades. Os animais vivem soltos na floresta. E mesmo os que recebem cuidados de crianças ou adultos nas aldeias podem voltar para a mata. A relação com <u>eles</u> é de cuidado e de respeito, equilibrando a subsistência e o bem-viver. Em vez de cachorros e gatinhos, são araras, papagaios, jabutis, macacos e capivaras os companheiros de brincadeiras e afagos dos pequenos.", "Para esses bichinhos, dá-se o nome de xerimbabos, que em tupi significa “coisa muito querida”. A palavra aparece em vários registros históricos quando há a descrição da relação entre os povos originários e os animais da mata, sendo o termo cunhado pelos próprios indígenas. <b>Nas aldeias</b>, faz parte da cultura cuidar de tudo o que tem vida na floresta."], "fonte": "tinyurl.com/3er3jb53 · Acesso em: 10.04.2025. Adaptado."}};
/* 🔴 CLD-391 · as justificativas do chute a gol · vivem em gol_etec.json, fora do banco */
var GOLETEC = {"2023-01": {"alts": {"A": {"c": "gol", "j": "Cada pronome foi trocado pelo termo certo, na ordem em que aparecem: o leitor, depois leitores e autor, depois o oxigênio, depois os oceanos."}, "B": {"c": "fora", "j": "Troca o primeiro pronome por «oceano», mas ali quem é chamado no texto é o leitor, não o mar."}, "C": {"c": "trave", "j": "Acerta o primeiro, o leitor. Mas erra do segundo em diante: o texto não fala de humanidade nem de clima nesses pontos."}, "D": {"c": "trave", "j": "Tem os termos certos, só que na ordem trocada. Ordem errada muda o sentido de cada pronome."}, "E": {"c": "fora", "j": "Inverte quem fala com quem logo no primeiro pronome e erra os três seguintes."}}}, "2023-02": {"alts": {"A": {"c": "fora", "j": "O presente do indicativo aparece mesmo, mas ele não serve para dizer que as ações são imutáveis. O texto fala de um problema que pode mudar."}, "B": {"c": "contra", "j": "Diz o contrário do que o texto é: a linguagem dele é simples e fala com qualquer leitor, não com pesquisadores."}, "C": {"c": "gol", "j": "É isso: o texto pergunta direto ao leitor e usa linguagem do dia a dia para prender a atenção e fazer pensar."}, "D": {"c": "fora", "j": "Não há narração. O texto informa e convence, não conta uma história com narrador."}, "E": {"c": "contra", "j": "A hashtag não é erro. Ela combina com o canal onde o texto circula, que é a internet."}}}, "2023-03": {"alts": {"A": {"c": "trave", "j": "Notícia conta um fato que aconteceu. Aqui o texto chama o leitor para agir, e isso não é notícia."}, "B": {"c": "fora", "j": "Enciclopédia só explica, sem pedir nada ao leitor. Este texto pede."}, "C": {"c": "trave", "j": "A linguagem é mesmo coloquial, mas crônica é opinião pessoal sobre o dia a dia. Aqui o objetivo é mobilizar."}, "D": {"c": "fora", "j": "Anúncio quer vender produto. Nenhum produto é vendido no texto."}, "E": {"c": "gol", "j": "É campanha social: informa para mobilizar o público a proteger os oceanos."}}}, "2023-04": {"alts": {"A": {"c": "fora", "j": "O texto não divide os oceanos em três tipos. Esse número não está lá."}, "B": {"c": "contra", "j": "Inverte: são os oceanos que são mais profundos, e as profundezas deles não são conhecidas."}, "C": {"c": "contra", "j": "Diz que são sinônimos, quando o texto existe justamente para mostrar a diferença entre os dois."}, "D": {"c": "fora", "j": "Nem toda a água do planeta está nos mares. Há água em rios, geleiras e no subsolo."}, "E": {"c": "gol", "j": "É a diferença que o texto explica: oceano é bem maior que mar."}}}, "2023-05": {"alts": {"A": {"c": "fora", "j": "Direitos do trabalhador é assunto importante, mas nada tem a ver com proteger a natureza."}, "B": {"c": "fora", "j": "Uma campeã do tênis. A biografia fala de esporte, não de defender o meio ambiente."}, "C": {"c": "trave", "j": "É um nadador, e o Aquaman também nada. Mas nadar não é a mensagem: a mensagem é proteger."}, "D": {"c": "fora", "j": "A assinatura de leis é história do Brasil, não defesa da natureza."}, "E": {"c": "gol", "j": "Ele dedicou a vida a proteger os povos indígenas e a floresta. É a mesma mensagem do Aquaman: defender quem não pode se defender."}}}, "2023-06": {"alts": {"A": {"c": "gol", "j": "129 km/h dividido por 3,6 dá 35,8 m/s. Aplicando a proporção do texto, o resultado é 2,9."}, "B": {"c": "trave", "j": "Sai perto, mas é o que aparece quando a conversão de km/h para m/s é feita pela metade."}, "C": {"c": "fora", "j": "Esse número aparece se a velocidade for usada em km/h, sem converter para metros por segundo."}, "D": {"c": "fora", "j": "Valor alto demais: nenhum caminho de conta com esses dados chega perto disso."}, "E": {"c": "fora", "j": "É quase treze vezes o resultado certo. A conta deve ter multiplicado onde era para dividir."}}}, "2023-07": {"alts": {"A": {"c": "contra", "j": "No fundo a água é mais densa, então o arrasto é maior e o gasto também. É o oposto do que se procura."}, "B": {"c": "gol", "j": "Perto da superfície a água é menos densa. Menos densidade, menos arrasto, menos gasto de energia."}, "C": {"c": "fora", "j": "Bater pés e braços é modo de nadar. A pergunta é sobre a profundidade, não sobre o estilo."}, "D": {"c": "trave", "j": "O meio é melhor que o fundo, mas ainda é mais denso que a superfície. Dá para gastar menos."}, "E": {"c": "fora", "j": "De novo o estilo de nado, e não a profundidade que a questão pede."}}}, "2023-08": {"alts": {"A": {"c": "contra", "j": "Inverte a seta: são os leões-marinhos e as orcas que comem lulas, não o contrário."}, "B": {"c": "trave", "j": "O zooplâncton está quase na base, mas o primeiro nível é o fitoplâncton, que produz o próprio alimento."}, "C": {"c": "gol", "j": "As focas comem de mais de um nível, então ocupam mais de um lugar na teia."}, "D": {"c": "trave", "j": "Os dois comem, sim, mas não só fitoplâncton nem no mesmo nível. A teia mostra caminhos diferentes."}, "E": {"c": "fora", "j": "Pinguim é ave, não mamífero. E a orca tem outras presas além dele."}}}, "2023-09": {"alts": {"A": {"c": "contra", "j": "Zooplâncton e copépodes são microscópicos e não produzem o próprio alimento: eles comem."}, "B": {"c": "contra", "j": "O fitoplâncton precisa de luz justamente para produzir alimento. Sem sol, ele não vive."}, "C": {"c": "gol", "j": "A baleia-azul filtra a água e retira o alimento. Ela não tem dentes, tem cerdas."}, "D": {"c": "trave", "j": "Há competição na teia, mas não entre esses. Cada um pega alimento em nível diferente."}, "E": {"c": "fora", "j": "Copépode é pequeno demais para ser o alimento principal do pinguim."}}}, "2023-10": {"alts": {"A": {"c": "contra", "j": "Humildade não é «não se importar». E o personagem se importa muito: é isso que a tirinha mostra."}, "B": {"c": "fora", "j": "Ele não sente vergonha de andar na rua. O que ele sente é pelo outro."}, "C": {"c": "gol", "j": "Ele se coloca no lugar de quem não tem, e isso é empatia."}, "D": {"c": "fora", "j": "Não é o tênis velho que o incomoda: é o pé descalço do outro."}, "E": {"c": "trave", "j": "A doação é um gesto bonito, mas o nome do sentimento que leva a ela é empatia, não autonomia."}}}, "2023-11": {"alts": {"A": {"c": "contra", "j": "A charge mostra o mar em risco, não o mar protegendo a vida."}, "B": {"c": "fora", "j": "Não há nada de vazamento nuclear na imagem."}, "C": {"c": "contra", "j": "O desenho mostra o problema, não a solução. É o contrário de sustentável."}, "D": {"c": "gol", "j": "É a poluição de mares e rios pondo a vida em risco, e a necessidade de agir."}, "E": {"c": "fora", "j": "Ninguém propõe mudar o curso dos rios. O assunto é a poluição."}}}, "2023-12": {"alts": {"A": {"c": "fora", "j": "Água quente não faz tsunâmi. Ela pode mudar o clima, que é outro assunto."}, "B": {"c": "fora", "j": "A rotação e a translação são movimentos de sempre. Tsunâmi é um evento repentino."}, "C": {"c": "fora", "j": "Corrente marítima move a água devagar e de forma contínua, não em onda gigante."}, "D": {"c": "gol", "j": "Tremor no fundo do mar ou vulcão empurra a água de uma vez, e é isso que forma a onda."}, "E": {"c": "fora", "j": "O núcleo da Terra não tem oceanos. Lá é rocha e metal, muito quentes."}}}, "2024-2025-01": {"alts": {"A": {"c": "contra", "j": "Adubo dá nutriente para a planta. Deixar de adubar não protege: atrapalha."}, "B": {"c": "contra", "j": "Lesma e caramujo comem a planta. Quem poliniza é abelha, borboleta e outros insetos."}, "C": {"c": "gol", "j": "Água na medida certa. Solo encharcado tapa o ar, e sem ar a raiz não respira."}, "D": {"c": "contra", "j": "Controle biológico é usar um bicho para segurar a praga. Evitar isso solta a praga, não impede."}, "E": {"c": "trave", "j": "Local ventilado é bom mesmo, mas o vento aumenta a evaporação, não impede."}}}, "2024-2025-02": {"alts": {"A": {"c": "fora", "j": "O texto diz o contrário: só uma parte pequena das espécies comestíveis virou cultura comercial."}, "B": {"c": "trave", "j": "Dependemos de poucas culturas, não de todas. É justamente esse o problema que o texto aponta."}, "C": {"c": "contra", "j": "Arroz, trigo e milho não dão todos os nutrientes. Faltar variedade é o risco que o texto descreve."}, "D": {"c": "gol", "j": "É o efeito da monocultura: o solo empobrece e as pragas se espalham."}, "E": {"c": "contra", "j": "As culturas esquecidas foram POUCO pesquisadas. É por isso que seguem esquecidas."}}}, "2024-2025-03": {"alts": {"A": {"c": "fora", "j": "No Centro-Oeste o forte é a soja. O trigo é plantado mais ao sul."}, "B": {"c": "fora", "j": "A Grã-Bretanha planta trigo, mas está longe de ter a maior área do planeta."}, "C": {"c": "contra", "j": "O Oriente Médio compra trigo, não exporta. O clima lá é seco demais."}, "D": {"c": "gol", "j": "Estados Unidos e Canadá plantam trigo em larga escala e exportam."}, "E": {"c": "contra", "j": "Deserto rochoso não dá trigo. Ele precisa de solo fértil e chuva."}}}, "2024-2025-04": {"alts": {"A": {"c": "contra", "j": "O texto diz o oposto: as PANCs alimentam bem."}, "B": {"c": "gol", "j": "É isso: usar mais PANCs pode ajudar a diminuir a fome."}, "C": {"c": "contra", "j": "As PANCs resistem BEM às pragas. É uma das vantagens que o texto cita."}, "D": {"c": "contra", "j": "Elas aguentam o clima do Brasil. Muitas nascem sozinhas por aqui."}, "E": {"c": "fora", "j": "O texto não fala em exportação. Fala em alimentar quem tem fome aqui."}}}, "2024-2025-05": {"alts": {"A": {"c": "trave", "j": "Acerta o segundo número, mas erra o primeiro: a perda na torrefação não é de 12%."}, "B": {"c": "fora", "j": "Os dois números estão errados. A perda e o número de sacas não batem com o texto."}, "C": {"c": "trave", "j": "Acerta o primeiro, 20%, e erra o segundo: com essa perda não são 35 sacas."}, "D": {"c": "gol", "j": "Perda de 20% na torrefação e 21 sacas para chegar ao total pedido."}, "E": {"c": "fora", "j": "Troca os dois valores de lugar e nenhum dos dois fecha a conta."}}}, "2024-2025-06": {"alts": {"A": {"c": "fora", "j": "Esse valor aparece se a divisão for feita ao contrário: corrente dividida por tensão."}, "B": {"c": "fora", "j": "Também vem da divisão invertida, com o expoente somado errado."}, "C": {"c": "trave", "j": "O número 5 está certo, mas o expoente saiu errado: faltou tratar as potências de dez."}, "D": {"c": "gol", "j": "Resistência é tensão dividida por corrente: 1×10⁻¹ dividido por 2×10⁻⁸ dá 5×10⁶ ohm."}, "E": {"c": "trave", "j": "Quase: o 5 está certo, mas o expoente ficou duas casas acima."}}}, "2024-2025-07": {"alts": {"A": {"c": "fora", "j": "O Cravo é citado de passagem. Não é ele que faz rir."}, "B": {"c": "contra", "j": "A linguagem da Planta Carnívora é solta e do dia a dia, não cerimoniosa."}, "C": {"c": "fora", "j": "Não há violência doméstica na tirinha. O assunto é outro."}, "D": {"c": "trave", "j": "Há mesmo comportamento humano em planta, mas o humor vem da fofoca, não do canibalismo."}, "E": {"c": "gol", "j": "O riso nasce da planta carnívora tratar a fofoca como coisa essencial para viver."}}}, "2024-2025-08": {"alts": {"A": {"c": "fora", "j": "«Rosa» e «Cravo» são nomes de personagens, não uma conversa da língua sobre ela mesma."}, "B": {"c": "contra", "j": "«Ojeriza» continua com o sentido de antipatia. Ela não vira coisa boa no texto."}, "C": {"c": "gol", "j": "«Amiga» e «menina» chamam a outra personagem. Chamar assim é vocativo."}, "D": {"c": "fora", "j": "«Pra» é redução de «para». Nas duas vezes indica destino, não lugar."}, "E": {"c": "contra", "j": "Em quadrinho a fala coloquial é o esperado. Ela combina com o gênero, não desmente."}}}, "2024-2025-09": {"alts": {"A": {"c": "gol", "j": "«Uai» é a reação de quem não esperava a pergunta. Isso é surpresa."}, "B": {"c": "fora", "j": "«Uai» não celebra nada. Ninguém está feliz na cena."}, "C": {"c": "fora", "j": "Não há susto nem ameaça no quadrinho."}, "D": {"c": "contra", "j": "Apatia é não reagir. «Uai» é exatamente uma reação."}, "E": {"c": "fora", "j": "Aversão seria nojo ou rejeição, e não é isso que a personagem demonstra."}}}, "2024-2025-10": {"alts": {"A": {"c": "fora", "j": "Guerra da Papoula foi na China e por causa do comércio de ópio. Outro país, outro assunto."}, "B": {"c": "fora", "j": "A Guerra das Duas Rosas foi na Inglaterra, séculos antes, entre duas famílias nobres."}, "C": {"c": "fora", "j": "Revolução do Mandacaru não existe. O nome foi inventado para confundir."}, "D": {"c": "fora", "j": "Revolução do Lótus não é o nome desse episódio nem aconteceu na Índia."}, "E": {"c": "gol", "j": "É a Revolução dos Cravos, em Portugal, que pôs fim à ditadura de Salazar."}}}, "2024-2025-11": {"alts": {"A": {"c": "gol", "j": "Angola e Cabo Verde foram colônias de Portugal e ficaram independentes nos anos 1970."}, "B": {"c": "fora", "j": "Nigéria foi colônia inglesa e África do Sul também. Nenhuma das duas foi portuguesa."}, "C": {"c": "fora", "j": "Madagascar e Senegal foram colônias da França."}, "D": {"c": "fora", "j": "A Etiópia quase nunca foi colonizada. O Saara Ocidental era espanhol."}, "E": {"c": "fora", "j": "República Centro-Africana e Mali foram colônias francesas."}}}, "2024-2025-12": {"alts": {"A": {"c": "fora", "j": "Ouro e eugenol não têm relação. O texto não diz isso."}, "B": {"c": "gol", "j": "O cravo repele formiga, e por isso entra no açucareiro."}, "C": {"c": "trave", "j": "O eugenol é usado em medicamentos, mas por ser anestésico e antisséptico, não por repelir."}, "D": {"c": "contra", "j": "A vanilina vem da baunilha. Ela não está no óleo do cravo."}, "E": {"c": "contra", "j": "O aroma é natural do cravo, não artificial, e não é de baunilha."}}}, "2025-2026-01": {"alts": {"A": {"c": "contra", "j": "A domesticação é bem mais antiga que a Idade Média. E ela veio antes, não depois, dessas invenções."}, "B": {"c": "contra", "j": "O texto diz o oposto: a convivência com animais ajudou a vida humana, não prejudicou."}, "C": {"c": "contra", "j": "Foi ao contrário: o povo que passou a beber leite foi ficando MENOS intolerante à lactose."}, "D": {"c": "gol", "j": "É isso: conviver com animais empurrou a cultura para frente, inclusive ferramentas e linguagem."}, "E": {"c": "contra", "j": "Nada foi atrasado. A domesticação acelerou o desenvolvimento."}}}, "2025-2026-02": {"alts": {"A": {"c": "fora", "j": "Número pequeno demais: daria muito mais cães-guia do que existem."}, "B": {"c": "trave", "j": "Chega perto, mas a divisão exata cai um pouco acima desse valor."}, "C": {"c": "gol", "j": "6,5 milhões divididos pelo número de cães em atividade dá cerca de 1 para cada 31 400."}, "D": {"c": "trave", "j": "Passou um pouco do resultado. A aproximação melhor é a anterior."}, "E": {"c": "fora", "j": "Valor alto demais: sobraria gente demais por cão."}}}, "2025-2026-03": {"alts": {"A": {"c": "trave", "j": "Os três números somam 100%, mas o do labrador está acima do que os dados mostram."}, "B": {"c": "fora", "j": "Troca as duas fatias menores de lugar, e ainda usa o valor errado para o labrador."}, "C": {"c": "contra", "j": "Três fatias iguais diriam que as raças aparecem na mesma quantidade, e não é o caso."}, "D": {"c": "gol", "j": "74% labradores, 8% golden e 18% de outras raças. É o que os dados mostram."}, "E": {"c": "trave", "j": "O labrador está certo em 74%, mas as duas fatias menores estão trocadas."}}}, "2025-2026-04": {"alts": {"A": {"c": "contra", "j": "Submeter-se à vontade dos outros não é o exemplo. O trecho fala de viver bem, não de obedecer."}, "B": {"c": "contra", "j": "O texto não elogia aceitar ser inferiorizado. Esse não é o modelo."}, "C": {"c": "contra", "j": "Inquietação constante é o oposto do que o cão representa ali."}, "D": {"c": "fora", "j": "O cão não deixa ninguém tenso. A companhia dele acalma."}, "E": {"c": "gol", "j": "O exemplo é viver a vida por inteiro, sem se prender a angústias que não levam a nada."}}}, "2025-2026-05": {"alts": {"A": {"c": "gol", "j": "Os egípcios viam graça, fertilidade, cuidado e rapidez nos felinos e passavam isso aos deuses."}, "B": {"c": "trave", "j": "Caçar rato era útil mesmo, mas não era «apenas» isso. A admiração ia além."}, "C": {"c": "fora", "j": "A admiração incluía os felinos grandes também, não só os que viviam dentro de casa."}, "D": {"c": "contra", "j": "Eles admiravam essas características, não as evitavam."}, "E": {"c": "contra", "j": "A ideia era o contrário: o humano se espelhava no animal, não se colocava acima dele."}}}, "2025-2026-06": {"alts": {"A": {"c": "trave", "j": "A endorfina aumenta, sim. Mas isso não dispensa acompanhamento quando ele é preciso."}, "B": {"c": "contra", "j": "O texto diz que a convivência melhora o convívio social, não que isola."}, "C": {"c": "fora", "j": "Nada no texto diz que remédio, exercício ou comida deixam de ser necessários."}, "D": {"c": "contra", "j": "É o contrário: cuidar do animal ajuda a criança a se organizar."}, "E": {"c": "gol", "j": "Melhora a convivência e a comunicação, e ajuda no desenvolvimento afetivo."}}}, "2025-2026-07": {"alts": {"A": {"c": "fora", "j": "A Primeira Revolução Industrial foi no século XVIII, com máquina a vapor, não com foguete."}, "B": {"c": "trave", "j": "A Segunda Guerra vem logo antes e trouxe os foguetes. Mas a corrida espacial é do período seguinte."}, "C": {"c": "trave", "j": "A reconstrução da Europa acontece no mesmo tempo, mas o nome da disputa entre as duas potências é outro."}, "D": {"c": "fora", "j": "As Grandes Navegações foram há mais de 500 anos, e o mar era o caminho, não o espaço."}, "E": {"c": "gol", "j": "É a Guerra Fria: Estados Unidos e União Soviética disputando, inclusive no espaço."}}}, "2025-2026-08": {"alts": {"A": {"c": "contra", "j": "«Xerimbabos» são os animais de estimação da comunidade, não as crianças."}, "B": {"c": "fora", "j": "Não há ataque nem trauma no texto. As irmãs convivem bem com os bichos."}, "C": {"c": "contra", "j": "O texto mostra harmonia, não desequilíbrio."}, "D": {"c": "gol", "j": "É isso: conviver bem com a fauna e a flora sustenta a vida daquela comunidade."}, "E": {"c": "fora", "j": "O conceito de animal doméstico não foi introduzido ali. A relação já existia, com outro nome."}}}, "2025-2026-09": {"alts": {"A": {"c": "contra", "j": "Ave tem pena, não pelo nem escama. E nem toda ave é carnívora."}, "B": {"c": "contra", "j": "Xerimbabo não é criado para abate. Ele é criado com afeto."}, "C": {"c": "trave", "j": "A parte do afeto está certa, mas nem todo xerimbabo fica em cativeiro nem é solto assim."}, "D": {"c": "gol", "j": "A onça está no topo da cadeia e, ao caçar, mantém o equilíbrio da floresta."}, "E": {"c": "fora", "j": "Nem todo animal sagrado é carnívoro. Sabiá e tartaruga não são."}}}, "2025-2026-10": {"alts": {"A": {"c": "trave", "j": "Acerta «tempo» no primeiro, mas erra os três seguintes."}, "B": {"c": "fora", "j": "Nenhuma das quatro expressões indica condição."}, "C": {"c": "fora", "j": "Consequência e origem não aparecem nessas expressões."}, "D": {"c": "fora", "j": "Repete o erro da B e ainda troca «companhia» por «ferramenta»."}, "E": {"c": "gol", "j": "Na ordem: tempo, lugar, companhia e lugar. É o que cada expressão marca."}}}, "2025-2026-11": {"alts": {"A": {"c": "contra", "j": "«Acabou indo» mostra ação terminada, não repetida."}, "B": {"c": "contra", "j": "Nada se prolonga: a locução justamente fecha a ação."}, "C": {"c": "gol", "j": "«Acabar» mais gerúndio marca a ação que se conclui, com ênfase no fim dela."}, "D": {"c": "fora", "j": "Não é o começo da ação, é o fim."}, "E": {"c": "contra", "j": "A ação se concretizou. Foi exatamente isso que aconteceu."}}}, "2025-2026-12": {"alts": {"A": {"c": "trave", "j": "«Pets» está certo, mas «territórios» não: o pronome retoma seres, não lugares."}, "B": {"c": "trave", "j": "«Pets» está certo, e «adultos» não. Quem volta no pronome são os animais."}, "C": {"c": "fora", "j": "«Indígenas» são as pessoas do texto, não os seres retomados pelo pronome."}, "D": {"c": "gol", "j": "O pronome «eles» retoma «pets» e «animais», os dois grupos citados antes."}, "E": {"c": "fora", "j": "Nenhum dos dois termos é retomado pelo pronome nesse parágrafo."}}}};

var ETEC_CAMPOS = ["inNome","inTurma"];
function guardaCampos(){
  var g={};
  ETEC_CAMPOS.forEach(function(k){ var e=$(k); if(e && String(e.value||"").trim()) g[k]=e.value });
  return g;
}
function devolveCampos(g){
  ETEC_CAMPOS.forEach(function(k){ var e=$(k);
    if(e && g[k]!==undefined && !String(e.value||"").trim()) e.value=g[k] });
}

function cardEsc(id,e,tit,desc,on,num){
  return '<button type="button" class="esc'+(on?" on":"")+'" onclick="escolher(\''+id+'\')">'+
    '<span class="tick">'+(on?"✔":"")+'</span>'+
    (num?'<span class="cnum">'+num+'</span>':'')+
    '<span class="e">'+e+'</span><b>'+tit+'</b><span class="d">'+desc+'</span></button>';
}
function escolher(id){
  if(id.indexOf("a::")===0){ filtroArea=(filtroArea===id.slice(3))?"":id.slice(3) }
  else if(id.indexOf("p::")===0){ filtroProva=(filtroProva===id.slice(3))?"":id.slice(3) }
  else { modo=id; if(modo==="comp") filtroProva=""; if(modo==="ano") filtroArea="" }
  salvar(); telaEscolha(); pintarBarra();
}

  }
  if(q.texto_proprio) h+='<div class="base"><p>'+q.texto_proprio+'</p></div>';

     A tela da questao fica exatamente como sempre foi. */
  h+='<div class="enun">'+apoio(q.enunciado,q)+'</div>';

     a gol embaixo, já deixar ela disponível mas SEPARADA do card grande da questão, como
     dica — pode ser emoji de tiro ao alvo ou lâmpada."
     O `q.objetivo` so' aparecia DEPOIS de responder, no fim do card. Agora ele vira um card
     proprio, fechado, que o estudante abre quando quiser — antes de marcar. Fechado por
     padrao para nao entregar o caminho de graca. */
  h+='<details class="dica"><summary>💡 Dica · o que a questão está pedindo</summary>'+
     '<div class="dx">🎯 '+esc(q.objetivo)+'</div></details>';

    h+='<button type="button" class="'+cls+'" onclick="marcar(\''+L+'\')"'+(r?" disabled":"")+'>'+
       '<span class="le">'+L+'</span><span class="tx">'+q.alternativas[L]+'</span></button>';

    if(r) h+=cardGol(q,L,r);

  /* depois de responder, o mesmo objetivo volta ABERTO, como fechamento da questao */
  if(r) h+='<div class="frase pedia"><b>🎯 O que a questão pedia:</b> '+esc(q.objetivo)+'</div>';

/* 🔴 CLD-398 · O APOIO NA TELA DA QUESTAO · grifo e glossario.
   Enquanto os dois JSON nao chegarem, esta funcao devolve o texto sem tocar nele — e' por
   isso que ligar a configuracao hoje nao muda nada: nao ha material para aplicar.
   Quando `grifo_etec.json` e `glos_etec.json` existirem, o 002 so' preenche as duas
   trocas abaixo. A regra que ja' vale: NUNCA mexer dentro de tag HTML. */
function apoio(txt, q){
  var s=String(txt||"");
  if(!CFG.grifo && !CFG.glos) return s;
  var partes=s.split(/(<[^>]*>)/);
  for(var i=0;i<partes.length;i++){
    if(partes[i].charAt(0)==="<") continue;      /* tag: nao se toca */
    if(CFG.grifo && temGrifo()) partes[i]=aplicarGrifo(partes[i], q);
    if(CFG.glos  && temGlos())  partes[i]=aplicarGlos(partes[i], q);
  }
  return partes.join("");
}
function aplicarGrifo(t,q){
  try{
    var lista=(GRIFO[q.pid]||{}).palavras||[];
    lista.forEach(function(w){
      if(!w) return;
      var rx=new RegExp("(^|[^\\wÀ-ÿ])("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\wÀ-ÿ])","gi");
      t=t.replace(rx,function(m,a,b){ return a+'<b class="gf">'+b+'</b>' });
    });
  }catch(e){}
  return t;
}
function aplicarGlos(t,q){
  try{
    var termos=(GLOS[q.pid]||{}).termos||{};
    Object.keys(termos).forEach(function(w){
      var rx=new RegExp("(^|[^\\wÀ-ÿ])("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\wÀ-ÿ])","i");
      t=t.replace(rx,function(m,a,b){
        return a+'<button type="button" class="past" onclick="abrirGlos(\''+q.pid+'\',\''+w.replace(/'/g,"")+'\')">'+b+'</button>';
      });
    });
  }catch(e){}
  return t;
}
function abrirGlos(pid,w){
  var d=((GLOS[pid]||{}).termos||{})[w]; if(!d) return;
  fecharGlos();
  var e=document.createElement("div");
  e.id="glosjan"; e.className="sumjan";
  e.innerHTML='<div class="sumcx"><div class="sumtt">📖 '+esc(w)+'</div>'+
    '<div class="glostx">'+esc(d)+'</div>'+
    '<button type="button" class="fechar" onclick="fecharGlos()">← Voltar</button></div>';
  e.onclick=function(ev){ if(ev.target===e) fecharGlos() };
  document.body.appendChild(e);
}

/* ══════════════════════════════════════════════════════════════════════════
   🔴 CLD-014 · PADRONIZADOR_002 · O MOTOR DA PORT V01.08 CHEGA AO ETEC · V05.03
   Marcos, 01/10/2026 06:34: "o estudante também pode voltar telas anteriores ... mas
   precisa ter o botão confirmar escolha, e após isso só mostra se ele acertou/errou, as
   justificativas de chute a gol da escolha dele, mas não deixa mais ele refazer até chegar
   no placar final; e também espero que haja placar parcial ... por objetivos em comum ...
   questões com objetivos semelhantes que possam ficar juntas na mesma classificação."
   Forma copiada da base (RETOMADA 2AAIM) pela PORT V01.08: identificação, topo, fundo por
   tipo, emojis do assunto e da NAV nas laterais, tela da pergunta, confirmar.
   As funções antigas estão acima, com o sufixo _OFF_CLD014 · nada apagado.
   ══════════════════════════════════════════════════════════════════════════ */
TURMA_COR = ["#1A5FA8","#1E8449","#C2410C","#7E22CE"];   /* CLD-014 · as cores da base (eram outras) */
var TURMA_BG = {A:"#D6E6F7",B:"#D5F0DF",C:"#FBE3D3",D:"#EDDCF9"}, TURMA_F={A:"#1A5FA8",B:"#1E8449",C:"#C2410C",D:"#7E22CE"};
var numero = "", SEL = {}, ULT_OK = true, iG = -1;
try{ numero = localStorage.getItem("etec_num_"+VERSAO)||"" }catch(e){}
function grupoDe(q){ return GRUPO_Q[q.pid] || "outros" }
function rotGrupo(g){ var x=GRUPOS.filter(function(y){ return y.id===g })[0]; return x?x.rot:g }
function gruposDaFila(){ var o=[]; fila.forEach(function(q){ var g=grupoDe(q); if(o.indexOf(g)<0) o.push(g) }); return o }

/* a fila junta as questões de objetivo parecido, na ordem dos grupos */
function montarFila(){
  montarFila_OFF_CLD014();
  var ord=GRUPOS.map(function(g){ return g.id });
  fila.sort(function(a,b){
    var ga=ord.indexOf(grupoDe(a)), gb=ord.indexOf(grupoDe(b));
    if(ga!==gb) return ga-gb;
    if(a.prova!==b.prova) return a.prova<b.prova?-1:1;
    return a.n-b.n;
  });
}

/* ── fundo e emojis da lateral · copiados da base pela PORT ── */
var CENA_AREA = {"Linguagens":["📖","✍️","💬","📚","🗞️","🎭","🖋️","📝"], "Matemática":["🔢","➗","📐","📊","🧮","📏","✖️","➕"],

/* ── a questão · pergunta no padrão da base · escolher e CONFIRMAR ── */
function telaQuestao(){
  var q=fila[iQ]; if(!q){ tela="fim"; return render() }
  var r=resp[q.pid], sel=r?r.marcou:SEL[q.pid], letras=Object.keys(q.alternativas), g=grupoDe(q);
  var h='<div class="croxo"><div class="cp-cmd"><span class="ctxnum">'+(iQ+1)+'</span>questão '+(iQ+1)+' de '+fila.length+
    ' · '+esc(rotGrupo(g))+'</div>'+
    '<div class="pills"><span class="navpill"><span class="em20">🔍</span> NAV.07 · lupa na prova</span>'+
    '<span class="navpill tipo"><span class="em20">'+emoA(q.area)+'</span> '+esc(q.comp)+'</span>'+
    '<span class="navpill tipo">prova '+q.prova.replace("-","/")+' · nº '+q.n+'</span></div>';
  if(q.base && BASES[q.base]){
    var b=BASES[q.base], primeira = fila.findIndex(function(x){ return x.base===q.base })===iQ;
    h+='<details class="base"'+(primeira?" open":"")+'><summary><span class="em20">📄</span> '+esc(b.titulo)+'</summary>'+
       (b.paragrafos||[]).map(function(p){ return '<p>'+p+'</p>' }).join("")+'</details>';
  }
  if(q.texto_proprio) h+='<div class="base"><p>'+q.texto_proprio+'</p></div>';
  h+='<div class="qbox"><div class="qlab"><span class="em20">❓</span> PERGUNTA</div><div class="enun">'+apoio(q.enunciado,q)+'</div></div>'+
     '<div class="conector"><span class="em20">👉</span> Leia as '+(["","uma","duas","três","quatro","cinco"][letras.length]||letras.length)+
     '. <b>Só uma</b> está certa. Marque <b>uma</b> e confirme.</div></div>';
  h+='<details class="dica"><summary><span class="em20">💡</span> Dica · o que a questão está pedindo</summary><div class="dx"><span class="em20">🎯</span> '+esc(q.objetivo)+'</div></details>';
  letras.forEach(function(L){
    var st=(sel===L?" sel":"");
    if(r){ if(L===q.gabarito) st+=" certo"; else if(L===r.marcou) st+=" errado" }
    h+='<button type="button" class="alt2'+st+'"'+(r?'':' onclick="marcar(\''+L+'\')"')+'>'+
       '<span class="altl"><span class="altletra">'+L+'</span></span><span class="afrase">'+q.alternativas[L]+'</span></button>';
    if(r) h+=cardGol(q,L,r);
  });
  if(r) h+='<div class="confok"><span class="em20">🔒</span> Resposta confirmada. Você pode voltar aqui para rever, mas só refaz no placar final.</div>'+
           '<div class="frase pedia"><b><span class="em20">🎯</span> O que a questão pedia:</b> '+esc(q.objetivo)+'</div>';
  else h+='<div class="confbx"><div class="contasel">Marque <b>uma</b> · '+(sel?1:0)+' de 1</div>'+
          '<button type="button" id="btConf" class="btconf"'+(sel?'':' disabled')+' onclick="confirmarQ()">confirmar</button></div>';
  $("palco").innerHTML=h;
}
function marcar(L){ var q=fila[iQ]; if(resp[q.pid]) return; SEL[q.pid]=L; telaQuestao(); pintarBarra() }
function confirmarQ(){ var q=fila[iQ], L=SEL[q.pid]; if(!L || resp[q.pid]) return;
  resp[q.pid]={marcou:L, ok:(L===q.gabarito), ts:Date.now()}; ULT_OK=(L===q.gabarito); salvar(); render() }

/* ── placar parcial por grupo de objetivo e placar final ── */
function contaGrupo(g){ var its=fila.filter(function(q){ return grupoDe(q)===g }), ac=0, fe=0;
  its.forEach(function(q){ var r=resp[q.pid]; if(r){ fe++; if(r.ok) ac++ } }); return {its:its, ac:ac, fe:fe} }
function blocoGrupo(g,k){ var c=contaGrupo(g);
  var h='<div class="card"><h2><span class="ctxnum">'+(k+1)+'</span> '+esc(rotGrupo(g))+' · '+c.ac+' de '+c.its.length+'</h2>';
  c.its.forEach(function(q){ var r=resp[q.pid];
    h+='<div class="lingrupo"><span class="em20">'+(!r?"🔲":(r.ok?"✅":"❌"))+'</span><span><b>prova '+q.prova.replace("-","/")+' · nº '+q.n+'</b> · '+
       esc(q.comp)+' · '+esc(q.assunto)+' · NAV.07</span></div>' });
  return h+'</div>' }
function telaParcial(){
  var gs=gruposDaFila(); if(iG<0 || iG>=gs.length) iG=Math.max(0,gs.indexOf(grupoDe(fila[iQ]||{}))); var g=gs[iG];
  var h='<div class="card"><h1><span class="em20">📊</span> Placar parcial</h1><div class="sub">Você terminou o grupo '+(iG+1)+' de '+gs.length+'.</div></div>'+blocoGrupo(g,iG);
  h+='<div class="card"><h2><span class="em20">🗺️</span> Os grupos deste caminho</h2>';
  gs.forEach(function(x,k){ var c=contaGrupo(x), feito=(c.fe===c.its.length);
    h+='<div class="lingrupo'+(k===iG+1?' pulsa':'')+'"><span class="em20">'+(feito?"✅":(k===iG+1?"👉":"🔲"))+'</span><span><b>'+(k+1)+' · '+esc(rotGrupo(x))+'</b> · '+c.ac+' de '+c.its.length+'</span></div>' });
  $("palco").innerHTML=h+'</div>';
}
function telaFim(){
  telaFim_OFF_CLD014();
  var gs=gruposDaFila(), h='<div class="card"><h2><span class="em20">🗂️</span> Por grupo de objetivo</h2><div class="sub">Questões com objetivo parecido ficam juntas.</div></div>';
  gs.forEach(function(g,k){ h+=blocoGrupo(g,k) });
  h+='<div class="card"><button type="button" class="btrefaz" onclick="refazerCaminho()"><span class="em20">↻</span> Refazer este caminho</button>'+
     '<div class="sub">Apaga as respostas deste caminho e começa de novo na 1ª questão.</div></div>';
  $("palco").insertAdjacentHTML("beforeend", h);
}
function refazerCaminho(){

/* ── navegação: voltar sempre · avançar a questão só depois de confirmar ── */
function render(){
  if(tela==="ident") telaIdent();
  else if(tela==="cfg") telaCfg();
  else if(tela==="escolha") telaEscolha();
  else if(tela==="q") telaQuestao();
  else if(tela==="parcial") telaParcial();
  else telaFim();
  pintarCena(); pintarBarra(); pintarTopo(); salvar();
  try{ pintarAjuda() }catch(e){}
  try{ window.scrollTo(0,0) }catch(e){}
}
function pintarTopo(){
  try{
    var feitas=fila.filter(function(q){ return resp[q.pid] }), ac=feitas.filter(function(q){ return resp[q.pid].ok }).length;
    var et={ident:"identificação",escolha:"escolha do caminho",cfg:"configurações",q:"questão "+(iQ+1)+" de "+fila.length,parcial:"placar parcial",fim:"placar final"}[tela]||tela;
    $("stVer").textContent=VERSAO;
    $("stNome").textContent="Estudante: "+(estudante?("nº "+(numero||"—")+" · "+estudante):"—");
    $("stTurma").textContent="Turma: "+(turma||"—");
    $("stTela").textContent=et;
    $("stNota").innerHTML='<span class="em20">✔</span> '+ac+' de '+(fila.length||0);
    var d=new Date(); $("stHora").innerHTML='<span class="em20">🕐</span> '+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }catch(e){}
}
function pintarBarra(){
  pintarBarra_OFF_CLD014();
  var p=$("bProx"), v=$("bVolta"), o=$("bOutro");
  if(tela==="ident"){ p.disabled=!( ($("inNome")&&$("inNome").value.trim().length>2) && !!turma && !!(numero||($("inNum")&&$("inNum").value)) ) }
  if(tela==="q"){ v.disabled=false; var q=fila[iQ]; p.disabled=!(q&&resp[q.pid]); p.textContent="Próxima →" }
  if(tela==="parcial"){ v.disabled=false; p.disabled=false; p.textContent=(iG>=gruposDaFila().length-1)?"Ver o placar final →":"Próximo grupo →"; o.style.display="" }
}
function avancar(){
  if(tela==="ident"){ estudante=$("inNome").value.trim(); numero=($("inNum")&&$("inNum").value||numero||"").trim();
    if(estudante.length<3 || !turma || !numero) return; tela="escolha"; return render() }
  if(tela==="q"){
    var q=fila[iQ]; if(!resp[q.pid]) return;
    var prox=fila[iQ+1];
    if(!prox || grupoDe(prox)!==grupoDe(q)){ iG=gruposDaFila().indexOf(grupoDe(q)); tela="parcial"; return render() }
    iQ++; return render();
  }
  if(tela==="parcial"){ if(iQ<fila.length-1){ iQ++; tela="q" } else tela="fim"; return render() }
  return avancar_OFF_CLD014();
}
function voltar(){
  if(tela==="q" && iQ===0){ tela="cfg"; return render() }
  if(tela==="q"){ var ant=fila[iQ-1], q=fila[iQ];
    if(ant && grupoDe(ant)!==grupoDe(q)){ iG=gruposDaFila().indexOf(grupoDe(ant)); iQ--; tela="parcial"; return render() }
    iQ--; return render() }
  if(tela==="parcial"){ tela="q"; return render() }
  if(tela==="fim"){ iG=gruposDaFila().length-1; tela="parcial"; return render() }
  return voltar_OFF_CLD014();
}
